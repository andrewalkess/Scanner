<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f4d3a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>Together 11 - Admin</title>
<style>
:root{--g:#1f4d3a;--g2:#2e6b52;--bg:#f5f3ef;--tx:#1d2433;--mut:#667;--card:#fff;--y:#ffd54f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--tx);line-height:1.6}
#app{max-width:1100px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header{background:var(--g);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header h1{font-size:1.15rem;margin:0;flex:1}
header button{width:auto;margin:0;background:#ffffff26;padding:7px 12px;font-size:.85rem}
#view{flex:1;padding:14px 14px calc(86px + env(safe-area-inset-bottom))}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;max-width:260px;background:none;color:var(--mut);border:0;border-radius:0;margin:0;padding:10px 4px;font-size:.85rem;font-weight:bold}
nav button b{display:block;font-size:1.35rem;line-height:1.2}
nav button.on{color:var(--g)}
nav button.on b{transform:scale(1.1)}
input,select,button{width:100%;padding:12px;font-size:1rem;border:1px solid #bbb;border-radius:10px;font-family:inherit;background:#fff;color:inherit}
button{background:var(--g);color:#fff;border:0;cursor:pointer;margin-top:10px;font-weight:bold}
button.alt{background:#555}button.red{background:#8a2b2b}button.ghost{background:#e8e6e1;color:var(--tx)}button:disabled{opacity:.5}
label{display:block;margin:10px 0 4px;font-weight:bold}
.box{background:var(--card);border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 1px 4px #0001}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:130px;margin-top:0}
.seg{display:flex;gap:8px}.seg button{margin:0;background:#e8e6e1;color:var(--tx)}.seg button.on{background:var(--g);color:#fff}
.err{color:#a11;font-weight:bold}.ok{color:#176b35;font-weight:bold}.mut{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.item{background:#fff;border-radius:14px;padding:14px;box-shadow:0 1px 4px #0001}
.item .nm{font-size:1.1rem;font-weight:bold}
.st{display:inline-block;padding:2px 10px;border-radius:999px;font-weight:bold;font-size:.8rem}
.st-review{background:#FFA726}.st-pending{background:#FFF176}.st-approved{background:#81C784}.st-rejected{background:#E57373}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.b{width:auto;flex:1;min-width:110px;margin:0;padding:9px 10px;font-size:.88rem;text-align:center;text-decoration:none;border-radius:9px;background:var(--g);color:#fff;font-weight:bold;border:0}
.b.ghost{background:#e8e6e1;color:var(--tx)}.b.red{background:#8a2b2b}.b.wa{background:#25d366}
.pg{display:flex;align-items:center;gap:10px;justify-content:center;margin:14px 0}.pg button{width:auto;margin:0;padding:9px 18px}
.big{font-size:2.6rem;font-weight:900;line-height:1.1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(95px,1fr));gap:10px}
.kpi{background:#fff;border-radius:14px;padding:14px;text-align:center;box-shadow:0 1px 4px #0001}
.kpi small{color:var(--mut);display:block}
.bar{height:12px;background:#e6e3dc;border-radius:99px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--g2);border-radius:99px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{background:#fff;border-radius:999px;padding:6px 14px;box-shadow:0 1px 3px #0001;font-weight:bold}
#res{text-align:center;font-size:1.1rem;transition:background .2s}#res .big{font-size:2.4rem}
.good{background:#d9f3e1;color:#176b35}.bad{background:#fbe0e0;color:#a11}.wait{background:#fff;color:#555}
#reader{width:100%;margin-top:10px;border-radius:12px;overflow:hidden}
.found{background:#faf8f3;border:1px solid #e3ded3;border-radius:10px;padding:10px 12px;margin-top:8px}
.ov{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;z-index:20;padding:10px}
.ovb{background:#fff;border-radius:14px;padding:12px;max-width:96vw;max-height:96vh;overflow:auto;text-align:center}
.ovb img{max-width:100%;max-height:78vh}
#toast{position:fixed;left:12px;right:12px;bottom:calc(88px + env(safe-area-inset-bottom));z-index:30;display:flex;flex-direction:column;gap:8px;pointer-events:none;align-items:center}
.tt{background:#222;color:#fff;padding:10px 16px;border-radius:12px;font-weight:bold;pointer-events:auto;max-width:520px}
.tt a{color:#7dffaa}
.login{max-width:420px;margin:0 auto;padding:30px 18px}
.login h1{text-align:center;color:var(--g);margin:10px 0 0}
</style></head><body>
<div id="app"></div><div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script>
// ======= رابط الـ Web app بتاع Apps Script (اللى بينتهى بـ /exec) =======
const APP_URL = 'https://script.google.com/macros/s/AKfycbzhOG6LUUf8TcIw6Hal3r6waD5HkAUV_uSf0IWS7qwVT5nMCD4Q3MgubraayKBfIJayrA/exec';
const EVENT = 'Together 11';

const $ = s => document.querySelector(s);
const ls = { get: k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }, put: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }, del: k => { try { localStorage.removeItem(k); } catch (e) {} } };
function h(t, a, ...c) { const e = document.createElement(t); for (const k in a || {}) { if (k.startsWith('on')) e[k] = a[k]; else if (a[k] != null) e.setAttribute(k, a[k]); } e.append(...c.flat().filter(x => x != null)); return e; }
const errMsg = e => tr((e && e.message ? e.message : String(e)).replace(/^Error:\s*/, ''));
// ---- ترجمة رسائل السيرفر للإنجليزى ----
const DAY_EN = { 'الجمعة': 'Friday', 'السبت': 'Saturday' };
const dEn = x => DAY_EN[x] || x;
const latin = t => String(t).replace(/[٠-٩]/g, c => '٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/م/g, 'PM').replace(/ص/g, 'AM');
const MSG = [
  [/^الباسورد غلط$/, 'Wrong password'], [/^مفتاح غير صحيح$/, 'Invalid key'], [/^كود غير صالح$/, 'Invalid code'], [/^تذكرة غير صالحة$/, 'Invalid ticket'],
  [/^اليوم غير صحيح$/, 'Invalid day'], [/^اختار اليوم$/, 'Choose a day'], [/^خطأ فى الطلب$/, 'Request error'], [/^أمر غير معروف$/, 'Unknown command'],
  [/^غير موجود$/, 'Not found'], [/^التذكرة مستخدمة$/, 'Ticket already used'], [/^الطلب مش فى المرحلة دى$/, 'Request is not at this stage'],
  [/^اليوم اكتمل العدد$/, 'This day is full'], [/^لا توجد صورة$/, 'No image'], [/^لا توجد صورة تحويل$/, 'No transfer receipt'], [/^مفيش إيميل لإعادة إرساله$/, 'Nothing to resend'],
  [/^الكود ليوم (.+)$/, m => 'Code is for ' + dEn(m[1])], [/^التذكرة ليوم (.+)$/, m => 'Ticket is for ' + dEn(m[1])],
  [/^الكود مستخدم قبل كده \((.*)\)$/, m => 'Code already used (' + latin(m[1]) + ')'], [/^دخل قبل كده \((.*)\)$/, m => 'Already checked in (' + latin(m[1]) + ')'],
  [/^مسموح بالدخول: (.*)$/, m => 'Entry allowed: ' + m[1]], [/^صالح \(معاينة، لم يُسجَّل الدخول\): (.*)$/, m => 'Valid (preview, entry not recorded): ' + m[1]],
  [/^تم التأكيد لكن الإيميل لم يُرسل \((.*?)\)\./, m => 'Confirmed, but the email was not sent (' + m[1] + '). Use the WhatsApp button or Resend later.'],
  [/^انتهى حد الإيميلات اليومى$/, 'Daily email limit reached'],
];
function tr(m) { m = String(m == null ? '' : m); for (const [re, f] of MSG) { const x = m.match(re); if (x) return typeof f === 'function' ? f(x) : f; } return m; }

const tokenOf = s => { s = String(s || '').trim(); const m = s.match(/[?&]s=([0-9A-Za-z]+)/); return m ? m[1] : s; };

const S = { role: '', cred: '', tab: '', day: ls.get('sd') || 'Friday', prev: ls.get('sp') === '1', f: { status: 'review', q: '', day: '', page: 1 }, urlToken: new URLSearchParams(location.search).get('s') || '' };
let timer = null, scanner = null, busy = false;

// ---------- الاتصال بالسيرفر ----------
async function api(body, ms) {
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), ms || 25000);
  try {
    const resp = await fetch(APP_URL, { method: 'POST', signal: ctl.signal, body: JSON.stringify(body) });
    return await resp.json();
  } finally { clearTimeout(to); }
}
const auth = () => S.role === 'admin' ? { pw: S.cred } : { key: S.cred };
async function adm(action, extra) {
  const r = await api(Object.assign({ action: action, pw: S.cred }, extra || {}));
  if (!r.ok) throw new Error(r.msg || 'An error occurred');
  return r.data;
}

// ---------- أدوات واجهة ----------
function toast(msg, ms, link) {
  const t = h('div', { class: 'tt' }, msg, link ? h('a', { href: link, target: '_blank', rel: 'noopener' }, ' Open WhatsApp') : null);
  $('#toast').append(t); setTimeout(() => t.remove(), ms || (link ? 9000 : 3500));
}
function beep(ok) {
  try {
    const A = window.AudioContext || window.webkitAudioContext; if (!A) return;
    const c = beep.c || (beep.c = new A()), t = c.currentTime;
    (ok ? [[880, 0, .12]] : [[220, 0, .15], [220, .22, .15]]).forEach(([f, s, d]) => {
      const o = c.createOscillator(), g = c.createGain(); o.frequency.value = f; o.type = 'square'; g.gain.value = .08;
      o.connect(g); g.connect(c.destination); o.start(t + s); o.stop(t + s + d);
    });
  } catch (e) {}
}
function modal(src, cap) {
  const ov = h('div', { class: 'ov', onclick: () => ov.remove() }, h('div', { class: 'ovb' }, h('p', {}, cap + ' (tap anywhere to close)'), h('img', { src: src })));
  document.body.append(ov);
}
const fmtTime = ms => new Date(ms).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });

// ---------- تسجيل الدخول ----------
function loginView(msg) {
  let role = ls.get('role') || 'admin';
  const inp = h('input', { type: 'password', autocomplete: 'off', placeholder: 'Password', onkeydown: e => { if (e.key === 'Enter') go(); } });
  const m = h('p', { class: 'err' }, msg || '');
  const seg = h('div', { class: 'seg' });
  const draw = () => { seg.replaceChildren(
    h('button', { class: role === 'admin' ? 'on' : '', onclick: () => { role = 'admin'; draw(); } }, 'Admin'),
    h('button', { class: role === 'security' ? 'on' : '', onclick: () => { role = 'security'; draw(); } }, 'Security (scanner)'));
    inp.placeholder = role === 'admin' ? 'Admin password' : 'Scanner key'; };
  draw();
  const btn = h('button', { onclick: () => go() }, 'Sign in');
  async function go() {
    if (!inp.value.trim()) return;
    btn.disabled = true; m.textContent = '';
    try { await login(role, inp.value.trim()); }
    catch (e) { m.textContent = errMsg(e); btn.disabled = false; }
  }
  $('#app').replaceChildren(h('div', { class: 'login' }, h('h1', {}, EVENT), h('p', { class: 'mut', style: 'text-align:center' }, 'Admin & scanner'),
    h('div', { class: 'box' }, seg, h('label', {}, 'Credentials'), inp, btn, m)));
}
async function login(role, cred) {
  S.role = role; S.cred = cred;
  if (role === 'admin') await adm('adminLogin');
  else { const r = await api({ action: 'find', key: cred, query: 'x' }); if (!r.ok) throw new Error(r.msg || 'مفتاح غير صحيح'); }
  ls.put('role', role); ls.put('cred', cred);
  start();
}
function logout() { ls.del('cred'); S.role = ''; S.cred = ''; stopCam(); clearInterval(timer); loginView(); }

// ---------- الهيكل ----------
function start() {
  const tabs = S.role === 'admin' ? [['home', '📊', 'Dashboard'], ['orders', '📋', 'Orders'], ['scan', '📷', 'Scanner']] : [['scan', '📷', 'Scanner']];
  const nav = h('nav', {}, ...tabs.map(t => h('button', { id: 'n-' + t[0], onclick: () => go(t[0]) }, h('b', {}, t[1]), t[2])));
  const hd = h('header', {}, h('h1', {}, EVENT), h('button', { onclick: () => go(S.tab, true) }, 'Refresh'), h('button', { onclick: logout }, 'Log out'));
  $('#app').replaceChildren(hd, h('div', { id: 'view' }), nav);
  go(S.urlToken ? 'scan' : tabs[0][0]);
}
function go(tab, force) {
  if (tab === S.tab && !force) return;
  if (tab !== 'scan') stopCam();
  clearInterval(timer);
  S.tab = tab;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.id === 'n-' + tab));
  window.scrollTo(0, 0);
  ({ home: homeView, orders: ordersView, scan: scanView })[tab]();
}

// ---------- الرئيسية (إحصائيات حية) ----------
function homeView() {
  const v = $('#view'); v.replaceChildren(h('p', { class: 'mut' }, 'Loading...'));
  const load = async () => {
    try {
      const d = await adm('adminStats');
      if (S.tab !== 'home') return;
      const days = Object.keys(d.days).map(k => {
        const x = d.days[k], pct = x.approved ? Math.round(x.entered * 100 / x.approved) : 0, cap = Math.round(x.approved * 100 / x.capacity);
        return h('div', { class: 'box' }, h('h2', { style: 'margin:0 0 8px' }, dEn(x.label)),
          h('div', { class: 'kpis' },
            h('div', { class: 'kpi' }, h('div', { class: 'big' }, String(x.entered)), h('small', {}, 'Checked in')),
            h('div', { class: 'kpi' }, h('div', { class: 'big' }, String(x.approved)), h('small', {}, 'Confirmed tickets')),
            h('div', { class: 'kpi' }, h('div', { class: 'big' }, String(Math.max(0, x.approved - x.entered))), h('small', {}, 'Not arrived yet')),
            h('div', { class: 'kpi' }, h('div', { class: 'big' }, String(x.bus || 0)), h('small', {}, 'Bus riders (confirmed)'))),
          h('p', { class: 'mut', style: 'margin:10px 0 0' }, 'Attendance of confirmed: ' + pct + '%'), h('div', { class: 'bar' }, h('i', { style: 'width:' + pct + '%' })),
          h('p', { class: 'mut', style: 'margin:0' }, 'Confirmed seats: ' + x.approved + ' of ' + x.capacity + ' (' + cap + '%)'), h('div', { class: 'bar' }, h('i', { style: 'width:' + Math.min(100, cap) + '%;background:#c9a227' })));
      });
      const st = d.status, L = { review: 'Card review', pending: 'Awaiting payment', approved: 'Confirmed', rejected: 'Rejected' };
      const chips = h('div', { class: 'chips' }, ...Object.keys(L).map(k => h('span', { class: 'chip' }, h('span', { class: 'st st-' + k, style: 'margin-left:6px' }, L[k]), String(st[k] || 0))), h('span', { class: 'chip' }, 'All requests: ' + d.total));
      const recent = h('div', { class: 'box' }, h('h3', { style: 'margin:0 0 6px' }, 'Latest check-ins'),
        ...(d.recent.length ? d.recent.map(r => h('div', { style: 'padding:6px 0;border-bottom:1px solid #eee' }, h('b', {}, r.name), h('span', { class: 'mut' }, ' - ' + dEn(r.day) + ' - ' + fmtTime(r.at)))) : [h('p', { class: 'mut' }, 'No one has checked in yet')]));
      v.replaceChildren(...days, h('div', { class: 'box' }, chips), recent, h('p', { class: 'mut', style: 'text-align:center;font-size:.8rem' }, 'Auto-refreshes every 15 s - last update ' + fmtTime(Date.now())));
    } catch (e) { v.replaceChildren(h('p', { class: 'err' }, errMsg(e))); }
  };
  load(); timer = setInterval(load, 15000);
}

// ---------- الطلبات ----------
function ordersView() {
  const v = $('#view'), F = S.f;
  const ST = { review: 'Card review', pending: 'Awaiting payment', approved: 'Confirmed', rejected: 'Rejected' };
  const LBL = { review: 'Card review', pending: 'Awaiting payment', approved: 'Confirmed', rejected: 'Rejected', entered: 'Checked in', all: 'All' };
  const opt = (val, t) => h('option', { value: val }, t);
  let qt = null;
  const q = h('input', { placeholder: 'Search by name or phone', value: F.q, oninput: () => { clearTimeout(qt); qt = setTimeout(() => { F.q = q.value; F.page = 1; load(); }, 400); } });
  const fs = h('select', { onchange: () => { F.status = fs.value; F.page = 1; load(); } }, ...Object.keys(LBL).map(k => opt(k, LBL[k])));
  fs.value = F.status;
  const fd = h('select', { onchange: () => { F.day = fd.value; F.page = 1; load(); } }, opt('', 'All days'), opt('Friday', 'Friday'), opt('Saturday', 'Saturday'));
  fd.value = F.day;
  const list = h('div', { class: 'grid' }), info = h('span', { class: 'mut' });
  const prevB = h('button', { class: 'ghost', onclick: () => { F.page--; load(); } }, 'Previous');
  const nextB = h('button', { class: 'ghost', onclick: () => { F.page++; load(); } }, 'Next');
  v.replaceChildren(h('div', { class: 'row' }, q, fs, fd), h('div', { style: 'height:12px' }), list, h('div', { class: 'pg' }, prevB, info, nextB));

  async function viewImg(fn, r, title) { try { modal(await adm(fn, { id: r.id }), r.name + ' - ' + title); } catch (e) { toast(errMsg(e)); } }
  function card(r) {
    const acts = h('div', { class: 'acts' });
    const add = (t, fn, cls) => acts.append(h('button', { class: 'b ' + (cls || ''), onclick: fn }, t));
    const wa = t => { if (r.wa) acts.append(h('a', { class: 'b wa', href: r.wa, target: '_blank', rel: 'noopener' }, t)); };
    const act = (a, t, cls, openWa) => add(t, async ev => {
      if (a === 'reject' && !confirm('Reject ' + r.name + "'s request?")) return;
      const btn = ev.currentTarget; btn.disabled = true;
      const w = openWa ? window.open('', '_blank') : null;   // لازم يتفتح فورا مع الضغطة عشان المتصفح ما يمنعوش
      try {
        const x = await adm('adminAct', { id: r.id, act: a });
        if (x.msg) toast(tr(x.msg), 6000);
        if (w) { if (x.wa) w.location = x.wa; else w.close(); }
        else if (openWa && x.wa) toast('Browser blocked WhatsApp.', 9000, x.wa);
      } catch (e) { if (w) w.close(); toast(errMsg(e)); }
      load();
    }, cls);
    if (r.hasId) add('ID card', () => viewImg('adminGetId', r, 'ID card'), 'ghost');
    if (r.hasPay) add('Receipt', () => viewImg('adminGetPay', r, 'Transfer receipt'), 'ghost');
    if (r.status === 'review') { act('approveId', 'Approve + WhatsApp', '', true); act('reject', 'Reject', 'red'); }
    else if (r.status === 'pending') { wa('WhatsApp (payment link)'); act('approve', 'Confirm payment + WhatsApp', '', true); act('reject', 'Reject', 'red'); }
    else if (r.status === 'approved') { wa('WhatsApp (ticket)'); }
    return h('div', { class: 'item' },
      h('div', { style: 'display:flex;justify-content:space-between;gap:8px;align-items:center' }, h('span', { class: 'nm' }, r.name), h('span', { class: 'st st-' + r.status }, ST[r.status] || r.status)),
      h('div', { class: 'mut' }, '#' + r.id + ' - ' + dEn(r.day) + (r.bus ? ' - Bus' : ' - No bus') + ' - Receipt: ' + (r.hasPay ? 'Uploaded' : (r.txref || 'Not sent'))),
      r.usedAt ? h('div', { class: 'ok' }, 'Checked in: ' + new Date(r.usedAt).toLocaleString('en-GB')) : null, acts);
  }
  async function load() {
    list.style.opacity = .5;
    try {
      const d = await adm('adminList', { filter: F.status, q: F.q, page: F.page, day: F.day });
      F.page = d.page;
      [...fs.options].forEach(o => { o.textContent = LBL[o.value] + ' (' + (d.counts[o.value] || 0) + ')'; });
      info.textContent = 'Page ' + d.page + ' of ' + d.pages + ' (' + d.total + ' requests)';
      prevB.disabled = d.page <= 1; nextB.disabled = d.page >= d.pages;
      list.replaceChildren(...(d.rows.length ? d.rows.map(card) : [h('p', { class: 'mut' }, 'No results')]));
    } catch (e) { toast(errMsg(e)); }
    list.style.opacity = 1;
  }
  load();
}

// ---------- السكانر ----------
function stopCam() { if (scanner) { try { scanner.stop(); } catch (e) {} scanner = null; } }
function scanView() {
  const v = $('#view');
  const res = h('div', { id: 'res', class: 'box wait' }, 'Ready');
  const day = h('select', { onchange: save }, h('option', { value: 'Friday' }, 'Friday'), h('option', { value: 'Saturday' }, 'Saturday'));
  day.value = S.day;
  const prev = h('input', { type: 'checkbox', style: 'width:auto', onchange: save }); prev.checked = S.prev;
  function save() { S.day = day.value; S.prev = prev.checked; ls.put('sd', S.day); ls.put('sp', S.prev ? '1' : '0'); }
  function show(cls, big, msg) {
    res.className = 'box ' + cls; res.replaceChildren();
    if (big) res.append(h('div', { class: 'big' }, big));
    res.append(h('div', {}, msg));
    if (cls === 'good' || cls === 'bad') { beep(cls === 'good'); if (navigator.vibrate) navigator.vibrate(cls === 'good' ? 80 : [120, 60, 120]); }
  }
  async function check(code) {
    if (busy) return; busy = true; save();
    show('wait', '', 'Checking...');
    try {
      const r = await api(Object.assign({ action: 'scan', code: code, day: S.day, preview: S.prev }, auth()), 20000);
      show(r.ok ? 'good' : 'bad', r.ok ? '✔ ALLOWED' : '✖ DENIED', tr(r.msg));
    } catch (e) { show('bad', '✖', 'Connection failed. Check the internet and try again (do not assume the code was recorded).'); }
    busy = false;
  }
  async function enterById(id) {
    if (busy) return; busy = true; save();
    show('wait', '', 'Recording...');
    try {
      const r = await api(Object.assign({ action: 'enter', id: id, day: S.day, preview: S.prev }, auth()), 20000);
      show(r.ok ? 'good' : 'bad', r.ok ? '✔ ALLOWED' : '✖ DENIED', tr(r.msg));
      if (r.ok) { found.replaceChildren(); q.value = ''; }
    } catch (e) { show('bad', '✖', 'Connection failed. Check the internet and try again (do not assume the entry was recorded).'); }
    busy = false;
  }
  const camBtn = h('button', { onclick: async () => {
    if (scanner) { stopCam(); $('#reader').innerHTML = ''; camBtn.textContent = 'Start camera to scan next'; return; }
    try {
      scanner = new Html5Qrcode('reader'); let last = '', lastAt = 0;
      await scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: 250 }, text => {
        const now = Date.now();
        if (busy || (text === last && now - lastAt < 4000)) return;   // يتجاهل نفس الكود لو اتمسح تانى بسرعة
        last = text; lastAt = now; check(tokenOf(text));
      }, () => {});
      camBtn.textContent = 'Stop camera';
    } catch (e) { scanner = null; show('bad', '✖', 'Camera failed. Allow camera access in the browser.'); }
  } }, 'Start camera to scan next');
  const q = h('input', { placeholder: 'Phone (at least 4 digits) or name', autocomplete: 'off', onkeydown: e => { if (e.key === 'Enter') find(); } });
  const found = h('div', {});
  async function find() {
    const t = q.value.trim(); save();
    if (t.length < 3) return show('bad', '✖', 'Enter at least 4 phone digits, or 3 letters of the name');
    found.textContent = 'Searching...';
    try {
      const r = await api(Object.assign({ action: 'find', query: t }, auth()));
      found.replaceChildren();
      if (!r.ok) { found.textContent = tr(r.msg) || 'An error occurred'; return; }
      if (!r.list.length) { found.textContent = 'No confirmed ticket matches'; return; }
      r.list.forEach(x => {
        const it = h('div', { class: 'found' }, h('b', {}, x.name), h('div', { class: 'mut' }, dEn(x.dayLabel) + ' - phone ends with ' + x.phoneEnd));
        if (x.used) it.append(h('div', { class: 'err' }, 'Already checked in (' + new Date(x.usedAt).toLocaleTimeString('en-GB') + ')'));
        else if (x.day !== S.day) it.append(h('div', { class: 'err' }, 'Ticket is for ' + dEn(x.dayLabel)));
        else it.append(h('button', { onclick: () => enterById(x.id) }, 'Check in'));
        found.append(it);
      });
    } catch (e) { found.textContent = 'Connection failed. Check the internet and try again.'; }
  }
  v.replaceChildren(res,
    h('div', { class: 'box' }, h('div', { class: 'row' }, h('div', {}, h('label', { style: 'margin-top:0' }, 'Day'), day)), camBtn, h('div', { id: 'reader' }),
      h('label', { style: 'display:flex;align-items:center;gap:8px;font-weight:normal' }, prev, 'Preview mode (do not record entry)')),
    h('div', { class: 'box' }, h('label', { style: 'margin-top:0' }, "If the code doesn't work: search by phone or name"), q, h('button', { class: 'alt', onclick: find }, 'Search'), found,
      h('p', { class: 'mut', style: 'font-size:.85rem;margin-bottom:0' }, "Compare the name with the person's ID before checking in.")));
  // لو الصفحة اتفتحت من QR بكاميرا الموبايل العادية (?s=التوكن)
  if (S.urlToken) { const t = S.urlToken; S.urlToken = ''; history.replaceState(null, '', location.pathname); check(t); }
}

// ---------- التشغيل ----------
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
(async () => {
  const role = ls.get('role'), cred = ls.get('cred');
  if (role && cred) {
    $('#app').replaceChildren(h('p', { class: 'mut', style: 'text-align:center;margin-top:40vh' }, 'Signing in...'));
    try { await login(role, cred); return; } catch (e) {
      loginView(/(password|key)/i.test(errMsg(e)) ? errMsg(e) : 'Connection failed. Check the internet and try again.'); return;
    }
  }
  loginView(S.urlToken ? 'Sign in with the scanner key and the code will be checked automatically' : '');
})();
</script></body></html>
