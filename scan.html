<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>دخول الايفنت</title>
<style>
*{box-sizing:border-box}body{font-family:Tahoma,Arial,sans-serif;margin:0;background:#f5f3ef;color:#1d2433;line-height:1.7}
main{max-width:520px;margin:0 auto;padding:16px}h1{font-size:1.4rem;margin:.2em 0}
.box{background:#fff;border-radius:12px;padding:16px;margin:12px 0;box-shadow:0 1px 4px #0001}
label{display:block;margin:10px 0 4px;font-weight:bold}input,select,button{width:100%;padding:12px;font-size:1rem;border:1px solid #bbb;border-radius:8px;font-family:inherit}
button{background:#1f4d3a;color:#fff;border:0;cursor:pointer;margin-top:10px}button.alt{background:#555}button:disabled{opacity:.5}
.row{display:flex;align-items:center;gap:8px;margin-top:10px}.row input{width:auto}.row label{margin:0}
#res{text-align:center;font-size:1.1rem}.big{font-size:2.2rem;font-weight:bold}
.good{background:#d9f3e1;color:#176b35}.bad{background:#fbe0e0;color:#a11}.wait{background:#fff;color:#555}
#reader{width:100%;margin-top:10px}
</style></head><body><main>
<h1 id="title">دخول الايفنت</h1>
<div id="res" class="box wait">جاهز</div>

<div class="box">
  <button id="camBtn">تشغيل الكاميرا لمسح التالى</button>
  <div id="reader"></div>
</div>

<div class="box">
  <label>المفتاح</label><input id="key" type="password" autocomplete="off">
  <label>اليوم</label>
  <select id="day"><option value="Friday">الجمعة</option><option value="Saturday">السبت</option></select>
  <div class="row"><input id="prev" type="checkbox"><label for="prev">وضع المعاينة (من غير تسجيل دخول)</label></div>
  <button id="goBtn" class="alt">تسجيل الدخول للكود الظاهر فى الرابط</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script>
// ======= الصق هنا رابط الـ Web app بتاع Apps Script (اللى بينتهى بـ /exec) =======
const APP_URL = 'PASTE_YOUR_EXEC_URL_HERE';

const $ = id => document.getElementById(id);
const get = k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
const put = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const tokenOf = s => { s = String(s || '').trim(); const m = s.match(/[?&]s=([0-9A-Za-z]+)/); return m ? m[1] : s; };

$('key').value = get('sk');
$('day').value = get('sd') || 'Friday';
$('prev').checked = get('sp') === '1';
const saveSettings = () => { put('sk', $('key').value); put('sd', $('day').value); put('sp', $('prev').checked ? '1' : '0'); };
['key', 'day', 'prev'].forEach(i => $(i).addEventListener('change', saveSettings));

function showRes(cls, big, msg) {
  const r = $('res'); r.className = 'box ' + cls;
  r.innerHTML = ''; 
  if (big) { const b = document.createElement('div'); b.className = 'big'; b.textContent = big; r.append(b); }
  const p = document.createElement('div'); p.textContent = msg; r.append(p);
  if (navigator.vibrate) navigator.vibrate(cls === 'good' ? 80 : [120, 60, 120]);
}

let busy = false;
async function check(code) {
  if (busy) return; busy = true;
  saveSettings();
  if (!$('key').value.trim()) { showRes('bad', '✖', 'اكتب المفتاح الأول'); busy = false; return; }
  if (APP_URL.indexOf('PASTE') === 0) { showRes('bad', '✖', 'لازم تحط رابط الـ exec فى APP_URL داخل الملف'); busy = false; return; }
  showRes('wait', '', 'جاري التحقق...');
  try {
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 20000);
    const resp = await fetch(APP_URL, { method: 'POST', signal: ctl.signal,
      body: JSON.stringify({ key: $('key').value, code: code, day: $('day').value, preview: $('prev').checked }) });
    clearTimeout(to);
    const r = await resp.json();
    showRes(r.ok ? 'good' : 'bad', r.ok ? '✔ مسموح' : '✖ مرفوض', r.msg || '');
  } catch (e) {
    showRes('bad', '✖', 'تعذر الاتصال. شوف النت وجرّب تانى (ماتفترضش إن الكود اتسجل).');
  }
  busy = false;
}

// 1) لو الصفحة اتفتحت من QR بكاميرا الموبايل العادية (?s=التوكن)
const urlToken = new URLSearchParams(location.search).get('s');
function runUrlToken() { if (urlToken) check(urlToken); }
$('goBtn').onclick = () => { if (urlToken) check(urlToken); else showRes('bad', '✖', 'مفيش كود فى الرابط. استخدم الكاميرا.'); };
if (urlToken) {
  if ($('key').value.trim()) { history.replaceState(null, '', location.pathname); check(urlToken); }   // بيشيل الكود من الرابط عشان إعادة التحميل ماتحسبش مرة تانية
  else showRes('wait', '', 'اكتب المفتاح واختار اليوم، وبعدين دوس "تسجيل الدخول".');
}

// 2) مسح مستمر بالكاميرا من جوه الصفحة (أسرع فى الطابور)
let scanner = null, last = '', lastAt = 0;
$('camBtn').onclick = async () => {
  if (scanner) { try { await scanner.stop(); } catch (e) {} scanner = null; $('reader').innerHTML = ''; $('camBtn').textContent = 'تشغيل الكاميرا لمسح التالى'; return; }
  try {
    scanner = new Html5Qrcode('reader');
    await scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: 250 }, text => {
      const now = Date.now();
      if (busy || (text === last && now - lastAt < 4000)) return;   // يتجاهل نفس الكود لو اتمسح تانى بسرعة
      last = text; lastAt = now;
      check(tokenOf(text));
    }, () => {});
    $('camBtn').textContent = 'إيقاف الكاميرا';
  } catch (e) {
    scanner = null; showRes('bad', '✖', 'الكاميرا ماشتغلتش. اسمح للمتصفح بالكاميرا.');
  }
};
</script></main></body></html>
